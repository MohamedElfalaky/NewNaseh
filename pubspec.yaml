name: nasooh
description: A new Flutter project.

version: 1.0.3+4

environment:
  sdk: ">=2.18.6 <3.0.0"


dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.5
  lottie:
  http:
  shared_preferences: ^2.2.2
  fluttertoast: ^8.2.4
  flutter_spinkit: ^5.2.1
  intl_phone_field: ^3.2.0
  password_text_field: ^2.0.0
  flutter_svg: ^2.0.10+1
  dropdown_textfield: ^1.0.8
  flutter_native_splash:
  badges: ^3.1.2
  smooth_page_indicator: ^1.1.0
  pinput: ^4.0.0
  image_picker: ^1.0.8
  dotted_border: ^2.1.0
  flutter_countdown_timer: ^4.1.0
  photo_view: ^0.14.0
  dotted_line: ^3.2.2
  get: ^4.6.6
  firebase_messaging:
  flutter_local_notifications:
  firebase_core:
  flutter_launcher_icons: ^0.13.1
  audioplayers:
  file_picker: ^8.0.0+1
  url_launcher:
  record: ^5.0.5
  permission_handler:
  flutter_linkify: ^6.0.0
  cached_network_image: ^3.3.1
  uuid:
  path_provider: ^2.1.2
  dio:
  mime_type:



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
flutter_launcher_icons:

  android: "launcher_icon"
  ios: true
  image_path: "assets/images/PNG/logo.png"


flutter_native_splash:
  image: assets/images/PNG/NasohSplash.png
  background_image: assets/images/PNG/SplashScreenBackGround.png
  android: true
  ios: true
  android_12:
    color: "#0085A5"
    image: assets/images/PNG/NasohSplash.png
    background_image: assets/images/PNG/SplashScreenBackGround.png

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/SVGs/
    - assets/images/Jsons/
    - assets/images/PNG/
    - assets/language/


  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
